<script>
    async function loadVisits() {
        try {
            const response = await fetch(
                "https://api.counterapi.dev/v1/blebbyboi-homepage/visits"
            );

            const data = await response.json();

            document.getElementById("counter").textContent =
                data.count ?? "???";
        } catch (error) {
            console.error(error);
            document.getElementById("counter").textContent = "???";
        }
    }

    loadVisits();
</script>
